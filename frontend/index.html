<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Matchora – Find Jobs That Match Your Resume & Skills</title>
    <meta
      name="description"
      content="Discover fresh job opportunities matched to your resume, skills and experience. Analyze your resume, find relevant jobs and simplify your job search with Matchora."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://matchora.co.in/" />

    <!-- Brand -->
    <meta name="application-name" content="Matchora" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.png" />

    <!-- Open Graph: LinkedIn, WhatsApp, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Matchora" />
    <meta property="og:title" content="Matchora – Find Jobs That Match Your Resume & Skills" />
    <meta
      property="og:description"
      content="Stop scrolling through irrelevant jobs. Discover opportunities that match your resume, skills and experience with Matchora."
    />
    <meta property="og:url" content="https://matchora.co.in/" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Matchora – Resume-Based Job Matching" />
    <meta
      name="twitter:description"
      content="Discover fresh jobs matched to your resume and skills with Matchora."
    />

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
